# No 'push' trigger: uploading code does not publish the iPhone website.
# Manually start only after the phase28-check workflow and data backup are verified.
name: TEMPO Phase 28 - Bewusst veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Planungstests und Produktions-Build
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Quellcode auf private Daten prüfen
        run: npm run test:security
      - name: Tests einschließlich Datenintegrität
        run: npm run test:logic
      - name: Vollständigen Produktions-Build erstellen
        run: npm run build
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Freigegebenen Build hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Nach erfolgreichen Tests veröffentlichen
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: TEMPO auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
