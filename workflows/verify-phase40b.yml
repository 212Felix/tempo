name: TEMPO Phase 40B – Test vor Veröffentlichung

on:
  push:
    branches:
      - phase40b-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4
      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten laden
        run: npm install --no-audit --no-fund
      - name: Sicherheits-, Logik- und Produktions-Build-Prüfung
        run: npm run verify
